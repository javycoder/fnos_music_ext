name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "要（补）发布的 tag，如 v2.7.0"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  package:
    name: package (${{ matrix.variant }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: generic
            runner: ubuntu-latest
            image_assets: skip
            image_arch: ""
          - variant: prebuilt-amd64
            runner: ubuntu-latest
            image_assets: require
            image_arch: amd64
          - variant: prebuilt-arm64
            runner: ubuntu-24.04-arm
            image_assets: require
            image_arch: arm64
    env:
      ALIPAY_QRCODE: ${{ secrets.ALIPAY_QRCODE }}
      WECHAT_QRCODE: ${{ secrets.WECHAT_QRCODE }}
      TAG: ${{ inputs.tag || github.ref_name }}
      FPK_IMAGE_ASSETS: ${{ matrix.image_assets }}
      FPK_IMAGE_ARCH: ${{ matrix.image_arch }}
      FPK_VARIANT: ${{ matrix.variant }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
          fetch-depth: 0

      - name: Verify tag matches VERSION
        id: release-kind
        run: |
          python3 proxy/version.py --tag "$TAG" --github-output "$GITHUB_OUTPUT"

      - name: Verify stable release is merged into main
        if: steps.release-kind.outputs.formal == 'true'
        run: |
          git fetch origin main
          git merge-base --is-ancestor HEAD origin/main

      - name: Verify official music compatibility record
        run: python3 scripts/check_music_compat.py

      - name: Run packaging tests
        if: matrix.variant == 'generic'
        run: |
          python -m pip install pytest qrcode pillow zxing-cpp PyYAML
          python -m pytest packaging/tests/

      - name: Install donation QR dependencies (optional)
        if: env.ALIPAY_QRCODE != '' || env.WECHAT_QRCODE != ''
        run: python3 -m pip install --quiet qrcode pillow

      - name: Install CJK font for QR badge (best-effort)
        if: env.ALIPAY_QRCODE != ''
        run: sudo apt-get install -y --no-install-recommends fonts-noto-cjk || true

      - name: Generate Alipay QR code (optional)
        if: env.ALIPAY_QRCODE != ''
        run: |
          python3 scripts/gen_alipay_qr.py
          test -s webui-service/static/alipay.png

      - name: Generate WeChat QR code (optional)
        if: env.WECHAT_QRCODE != ''
        run: |
          python3 scripts/gen_wechat_qr.py
          test -s webui-service/static/wechat.png

      - name: Build fpk package
        run: |
          set -euo pipefail
          ./packaging/fpk/build.sh
          shopt -s nullglob
          packages=(dist/fnmusic-ext-*.fpk)
          if [ "${#packages[@]}" -ne 1 ]; then
            echo "ERROR: expected exactly one FPK, got ${#packages[@]}" >&2
            exit 1
          fi
          name="$(basename "${packages[0]}")"
          version="$(python3 proxy/version.py --format version)"
          case "${FPK_VARIANT}" in
            generic) expected="fnmusic-ext-${version}.fpk" ;;
            prebuilt-amd64) expected="fnmusic-ext-${version}-prebuilt-amd64.fpk" ;;
            prebuilt-arm64) expected="fnmusic-ext-${version}-prebuilt-arm64.fpk" ;;
            *) echo "ERROR: unknown package variant ${FPK_VARIANT}" >&2; exit 1 ;;
          esac
          test "${name}" = "${expected}"
          ( cd dist && sha256sum -c "${name}.sha256" )
          if [ "${FPK_VARIANT}" = "generic" ]; then
            test ! -e packaging/fpk/.build/fpk/app/repo/assets/image
            test ! -e packaging/fpk/.build/fpk/app/repo/assets/proxy-wheels
          else
            test -s packaging/fpk/.build/fpk/app/repo/assets/image/manifest.json
            test -s packaging/fpk/.build/fpk/app/repo/assets/proxy-wheels/manifest.json
            python3 proxy/wheelhouse.py check \
              --manifest packaging/fpk/.build/fpk/app/repo/assets/proxy-wheels/manifest.json \
              --requirements proxy/requirements.txt
          fi

      - name: Verify donation assets in fpk
        run: |
          fpk_file="$(ls dist/fnmusic-ext-*.fpk)"
          python3 scripts/check_donate_assets.py "$fpk_file"

      - uses: actions/upload-artifact@v4
        with:
          name: fpk-${{ matrix.variant }}
          path: |
            dist/*.fpk
            dist/*.sha256
          if-no-files-found: error
          retention-days: 1

  release:
    needs: package
    runs-on: ubuntu-latest
    outputs:
      formal: ${{ steps.release-kind.outputs.formal }}
      fpk_name: ${{ steps.release-fpk.outputs.name }}
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
          fetch-depth: 0

      - name: Verify tag matches VERSION
        id: release-kind
        run: |
          python3 proxy/version.py --tag "$TAG" --github-output "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@v4
        with:
          pattern: fpk-*
          path: dist
          merge-multiple: true

      - name: Verify the three release packages
        run: |
          set -euo pipefail
          version="$(python3 proxy/version.py --format version)"
          for name in \
            "fnmusic-ext-${version}.fpk" \
            "fnmusic-ext-${version}-prebuilt-amd64.fpk" \
            "fnmusic-ext-${version}-prebuilt-arm64.fpk"
          do
            test -s "dist/${name}"
            test -s "dist/${name}.sha256"
            ( cd dist && sha256sum -c "${name}.sha256" )
          done
          count="$(find dist -maxdepth 1 -type f -name 'fnmusic-ext-*.fpk' | wc -l)"
          test "${count}" -eq 3

      - name: Extract changelog for this version
        run: |
          version="${{ steps.release-kind.outputs.display_version }}"
          awk -v ver="$version" '
            index($0, "## [" ver "]") == 1 { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > /tmp/release-notes.md
          if [ ! -s /tmp/release-notes.md ]; then
            echo "CHANGELOG.md 中未找到 ## [$version] 段落" >&2
            exit 1
          fi
          head -5 /tmp/release-notes.md

      - name: Remove previous published prereleases
        if: steps.release-kind.outputs.formal == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          export LC_ALL=C
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+[a-z]$ ]] || exit 1
          releases="$(gh api --paginate --slurp "repos/${GH_REPO}/releases?per_page=100")"
          candidates="$(jq -r --arg target "$TAG" '
            .[][] | select(.prerelease == true and .draft == false)
            | select(.tag_name != $target)
            | select(.tag_name | test("^v[0-9]+\\.[0-9]+\\.[0-9]+[a-z]$"))
            | [.id, .tag_name] | @tsv
          ' <<< "$releases")"
          while IFS=$'\t' read -r release_id old_tag; do
            [ -n "$release_id" ] || continue
            current="$(gh api "repos/${GH_REPO}/releases/${release_id}")"
            jq -e --arg id "$release_id" --arg tag "$old_tag" --arg target "$TAG" '
              (.id | tostring) == $id and .tag_name == $tag and .tag_name != $target
              and .prerelease == true and .draft == false
              and (.tag_name | test("^v[0-9]+\\.[0-9]+\\.[0-9]+[a-z]$"))
            ' <<< "$current" >/dev/null
            gh api --method DELETE "repos/${GH_REPO}/releases/${release_id}"
          done <<< "$candidates"
          remaining="$(gh api --paginate --slurp "repos/${GH_REPO}/releases?per_page=100")"
          jq -e --arg target "$TAG" '
            [.[][] | select(.prerelease == true and .draft == false and .tag_name != $target)]
            | length == 0
          ' <<< "$remaining" >/dev/null

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          packages=(dist/fnmusic-ext-*.fpk)
          if [ "${#packages[@]}" -eq 0 ]; then
            echo "ERROR: 没有可发布的 FPK" >&2
            exit 1
          fi
          files=()
          for fpk in "${packages[@]}"; do
            test -s "${fpk}.sha256"
            files+=("${fpk}" "${fpk}.sha256")
          done
          verify_local() {
            local fpk
            for fpk in "${packages[@]}"; do
              ( cd "$(dirname "${fpk}")" && sha256sum -c "$(basename "${fpk}").sha256" )
            done
          }
          verify_remote() {
            FNMUSIC_RELEASE_META="$1" python3 - "${packages[@]}" <<'PY'
          import json, os, pathlib, sys
          meta = json.loads(os.environ["FNMUSIC_RELEASE_META"])
          assets = {str(item.get("name") or ""): item for item in (meta.get("assets") or []) if isinstance(item, dict)}
          for raw in sys.argv[1:]:
              path = pathlib.Path(raw)
              local = pathlib.Path(str(path) + ".sha256").read_text(encoding="utf-8").split()[0].lower()
              remote = assets.get(path.name)
              if not isinstance(remote, dict):
                  raise SystemExit("ERROR: 发行附件缺失，拒绝补传或覆盖 " + path.name)
              digest = str(remote.get("digest") or "")
              if not digest.lower().startswith("sha256:"):
                  raise SystemExit("ERROR: 发行附件缺少 sha256 digest: " + path.name)
              if digest.split(":", 1)[1].strip().lower() != local:
                  raise SystemExit("ERROR: 已公开附件哈希不同，拒绝覆盖 " + path.name)
          print("release assets verified")
          PY
          }
          verify_local
          ver="${TAG#v}"
          title="fnmusic-ext ${ver}"
          pre_flags="--prerelease=false"
          case "$ver" in
            *[a-z])
              pre_flags="--prerelease"
              title="fnmusic-ext ${ver}（预发布，未经完整测试）"
              ;;
          esac
          if meta="$(gh release view "${TAG}" --json isDraft,assets)"; then
            is_draft="$(printf '%s' "${meta}" | jq -r '.isDraft')"
            if [ "${is_draft}" != "true" ]; then
              verify_remote "${meta}"
              gh release edit "${TAG}" --draft=false --title "$title" --notes-file /tmp/release-notes.md $pre_flags
            else
              gh release edit "${TAG}" --draft --title "$title" --notes-file /tmp/release-notes.md $pre_flags
              gh release upload "${TAG}" "${files[@]}" --clobber
              meta="$(gh release view "${TAG}" --json isDraft,assets)"
              verify_remote "${meta}"
              gh release edit "${TAG}" --draft=false --title "$title" --notes-file /tmp/release-notes.md $pre_flags
            fi
          else
            gh release create "${TAG}" --draft \
              --title "$title" \
              --notes-file /tmp/release-notes.md \
              $pre_flags \
              "${files[@]}"
            meta="$(gh release view "${TAG}" --json isDraft,assets)"
            verify_remote "${meta}"
            gh release edit "${TAG}" --draft=false --title "$title" --notes-file /tmp/release-notes.md $pre_flags
          fi

      - name: Record generic package name
        id: release-fpk
        run: |
          version="$(tr -d '[:space:]' < VERSION)"
          echo "name=fnmusic-ext-${version}.fpk" >> "$GITHUB_OUTPUT"

  update-moo-index:
    needs: release
    if: ${{ needs.release.outputs.formal == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Update moo.json from latest formal release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ ! -f tools/update_moo_index.py ]; then
            echo "main 上暂无 moo 索引脚本（未合入），跳过回填"
            exit 0
          fi
          python3 tools/update_moo_index.py

      - name: Commit index update
        run: |
          if [ ! -f moo.json ]; then
            echo "main 上暂无 moo.json，跳过提交"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add moo.json
          if git diff --cached --quiet; then
            echo "moo.json 无变化，跳过提交"
            exit 0
          fi
          git commit -m "chore(ci): 自动更新 moo 商店协议源索引 [skip ci]"
          git push

  publish-gitee:
    needs: [release, update-moo-index]
    if: ${{ always() && needs.release.result == 'success' && needs.release.outputs.formal == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      GITEE_REPO: javycoder/fnos_music_ext
      GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
      TAG: ${{ inputs.tag || github.ref_name }}
      FPK_NAME: ${{ needs.release.outputs.fpk_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - name: Publish release to Gitee
        if: env.GITEE_TOKEN != ''
        timeout-minutes: 15
        run: |
          set -euo pipefail
          tag="${TAG}"
          case "${tag#v}" in
            *[a-z])
              echo "[gitee] 迭代预发布（${tag}）跳过 Gitee 镜像发布"
              exit 0
              ;;
          esac
          ver="${tag#v}"
          version="$(tr -d '[:space:]' < VERSION)"
          notes_file="/tmp/release-notes.md"
          awk -v ver="${ver}" '
            index($0, "## [" ver "]") == 1 { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > "${notes_file}"
          if [ ! -s "${notes_file}" ]; then
            echo "CHANGELOG.md 中未找到 ## [${ver}] 段落" >&2
            exit 1
          fi
          api="https://gitee.com/api/v5/repos/${GITEE_REPO}"
          gcurl() {
            curl -sS --connect-timeout 15 --max-time 120 \
              --retry 3 --retry-all-errors --retry-delay 4 "$@"
          }
          synced=0
          for _ in $(seq 1 20); do
            if [ -n "$(git ls-remote "https://gitee.com/${GITEE_REPO}.git" "refs/tags/${tag}")" ]; then
              synced=1
              break
            fi
            sleep 30
          done
          if [ "${synced}" != 1 ]; then
            echo "ERROR: Gitee 镜像 10 分钟内未同步到 tag ${tag}" >&2
            exit 1
          fi
          http="$(gcurl -o /tmp/gitee-release.json -w '%{http_code}' \
            "${api}/releases/tags/${tag}?access_token=${GITEE_TOKEN}")"
          release_id=""
          if [ "${http}" = 200 ]; then
            release_id="$(jq -r 'if .id then .id else "" end' /tmp/gitee-release.json)"
          elif [ "${http}" != 404 ]; then
            echo "ERROR: 查询 Gitee 发行版失败 HTTP ${http}" >&2
            cat /tmp/gitee-release.json >&2 || true
            exit 1
          fi
          if [ -z "${release_id}" ]; then
            create_http="$(gcurl -o /tmp/gitee-create.json -w '%{http_code}' "${api}/releases" \
              -d "access_token=${GITEE_TOKEN}" \
              -d "tag_name=${tag}" \
              -d "target_commitish=${tag}" \
              -d "name=fnmusic-ext ${ver}" \
              --data-urlencode "body@${notes_file}")"
            if [ "${create_http}" != 201 ] && [ "${create_http}" != 200 ]; then
              echo "ERROR: 创建 Gitee 发行版失败 HTTP ${create_http}" >&2
              cat /tmp/gitee-create.json >&2 || true
              exit 1
            fi
            release_id="$(jq -r '.id' /tmp/gitee-create.json)"
          fi
          github_base="https://github.com/${GITHUB_REPOSITORY}/releases/download/${tag}"
          fpk_name="${FPK_NAME:-}"
          generic="fnmusic-ext-${version}.fpk"
          prebuilt_amd64="fnmusic-ext-${version}-prebuilt-amd64.fpk"
          prebuilt_arm64="fnmusic-ext-${version}-prebuilt-arm64.fpk"
          if [ -n "${fpk_name}" ] && [ "${fpk_name}" != "${generic}" ]; then
            echo "ERROR: GitHub Release 通用包名称与 VERSION 不匹配" >&2
            exit 1
          fi
          {
            cat "${notes_file}"
            echo
            echo "### 附件"
            for name in "${generic}" "${prebuilt_amd64}" "${prebuilt_arm64}"; do
              echo "- [${name}](${github_base}/${name})"
              echo "- [${name}.sha256](${github_base}/${name}.sha256)"
            done
          } > /tmp/gitee-body.md
          patch_http="$(gcurl -o /tmp/gitee-patch.json -w '%{http_code}' -X PATCH \
            "${api}/releases/${release_id}?access_token=${GITEE_TOKEN}" \
            -d "tag_name=${tag}" \
            -d "name=fnmusic-ext ${ver}" \
            --data-urlencode "body@/tmp/gitee-body.md")"
          if [ "${patch_http}" != 200 ]; then
            echo "ERROR: 更新 Gitee 发行版说明失败 HTTP ${patch_http}" >&2
            cat /tmp/gitee-patch.json >&2 || true
            exit 1
          fi
          echo "[gitee] 发行版发布完成: https://gitee.com/${GITEE_REPO}/releases"
