name: CI

on:
  push:
    branches: [main, dev, v2.9.0]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.11 = 已验证的最低支持版本；3.13 = 与生产 Docker 镜像一致
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      # 显式安装 node：lxmusic-service/test_bridge_node.py 依赖 node 跑 js/test_bridge.js，
      # 只靠 runner 预装一旦变动，桥的 13 个行为测试会静默 skip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install audio and proxy test tools
        run: sudo apt-get update && sudo apt-get install -y ffmpeg nginx

      - name: Install test dependencies
        run: >
          python -m pip install -r proxy/requirements.txt
          -r webui-service/requirements.txt
          pytest pytest-asyncio mutagen qrcode pillow PyYAML pytest-cov

      - name: Shell script syntax check
        run: |
          while IFS= read -r -d '' script; do
            bash -n "$script"
          done < <(git ls-files -z '*.sh')

      - name: Python compile check
        run: >
          python -m py_compile proxy/app.py proxy/recommend.py proxy/publicplaylists.py proxy/env_merge.py proxy/version.py
          lxmusic-service/app.py lxmusic-service/lxserver_client.py lxmusic-service/verify_source.py
          musicdl-service/app.py musicdl-service/hardening.py
          musicbox-service/app.py musicbox-service/runner.py musicbox-service/netease_ext.py musicbox-service/playback.py
          webui-service/app.py

      # 覆盖率仅作摘要展示（不设门槛）；cov 参数只出现在 CI，本地 pytest 无需装 pytest-cov
      - name: Run tests
        run: >
          python -m pytest
          --cov=proxy --cov=lxmusic-service --cov=musicdl-service --cov=musicbox-service --cov=webui-service
          --cov-report=term

  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Shellcheck errors
        run: |
          git ls-files -z '*.sh' | xargs -0 shellcheck -S error
          # fpk 生命周期脚本（无 .sh 后缀）同样纳入检查
          git ls-files -z 'packaging/fpk/cmd/*' | xargs -0 shellcheck -S error

  fpk:
    runs-on: ubuntu-latest
    env:
      # secrets 不能用于 steps.if，先映射到 job 级 env（同 release.yml GITEE_TOKEN 模式）
      ALIPAY_QRCODE: ${{ secrets.ALIPAY_QRCODE }}
    steps:
      - uses: actions/checkout@v4

      - name: Download fnpack
        run: |
          curl -fsSL -o fnpack \
            "https://static2.fnnas.com/fnpack/fnpack-${FNPACK_VERSION}-linux-amd64"
          chmod +x fnpack && sudo mv fnpack /usr/local/bin/fnpack
        env:
          FNPACK_VERSION: "1.2.3"

      # 打赏二维码不入库：配置了 ALIPAY_QRCODE secret（收款链接）时现场生成
      # PNG 打进包里（二维码中心叠加支付宝徽标，scripts/gen_alipay_qr.py）；
      # 未配置则跳过，运行时 WebUI 自动隐藏打赏卡片
      - name: Install CJK font for QR badge (best-effort)
        if: env.ALIPAY_QRCODE != ''
        run: sudo apt-get install -y --no-install-recommends fonts-noto-cjk || true

      - name: Generate Alipay QR code (optional)
        if: env.ALIPAY_QRCODE != ''
        run: |
          python3 -m pip install --quiet qrcode pillow
          python3 scripts/gen_alipay_qr.py

      - name: Build fpk package
        run: |
          ./packaging/fpk/build.sh
          ls -la dist/

      - name: Verify package artifact
        run: |
          fpk_file="$(ls dist/fnmusic-ext-*.fpk)"
          test -s "$fpk_file"
          test -s "${fpk_file}.sha256"
          # fpk 为 tar.gz，内层 app.tgz + cmd/config/wizard/manifest/ICON 齐全
          tar -tzf "$fpk_file" | grep -E '^app\.tgz$'
          tar -tzf "$fpk_file" | grep -E '^cmd/main$'
          tar -tzf "$fpk_file" | grep -E '^manifest$'
          tar -tzf "$fpk_file" | grep -E '^ICON\.PNG$'
          ( cd dist && sha256sum -c "$(basename "$fpk_file").sha256" )


  production:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [musicdl, musicbox, lxmusic]
        python: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install real production dependencies
        run: python -m pip install -r '${{ matrix.service }}-service/requirements.txt'
      - name: Offline dependency and CLI contract
        run: python tests/integration/production_contract.py '${{ matrix.service }}' --app-dir '${{ matrix.service }}-service'

  images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build unified fnmusic-sources image
        run: |
          docker compose -f docker-compose.yml build --build-arg BASE_IMAGE=python:3.13-slim \
            --build-arg PIP_INDEX_URL=https://pypi.org/simple \
            --build-arg APT_MIRROR= \
            fnmusic-sources
          docker tag fnmusic-sources:latest fnmusic-sources:ci
      - name: Verify non-root contract for each bundled service
        run: |
          for svc in musicdl musicbox lxmusic; do
            docker run --rm --network none --user 1000 --entrypoint python \
              -v "$PWD/tests/integration/production_contract.py:/tmp/production_contract.py:ro" \
              fnmusic-sources:ci /tmp/production_contract.py \
              "$svc" --app-dir "/srv/${svc}-service" --require-non-root
          done
      - name: Verify on-demand musicdl healthz
        run: |
          mkdir -p /tmp/fnrepo
          printf '%s\n' 'FNMUSIC_MUSICDL_ENABLED=true' 'FNMUSIC_WEBUI_ENABLED=false' > /tmp/fnrepo/.env
          name="fnmusic-ci-sources"
          trap 'docker logs "$name"; docker rm -f "$name"' EXIT
          docker run -d --name "$name" --network none \
            -v /tmp/fnrepo:/repo fnmusic-sources:ci
          ready=0
          for attempt in $(seq 1 40); do
            if docker exec "$name" python -c 'import urllib.request; urllib.request.urlopen("http://127.0.0.1:8001/healthz", timeout=2)'; then
              ready=1
              break
            fi
            sleep 1
          done
          test "$ready" = 1

  # 双架构真实运行验证：amd64 原生构建，arm64 走 QEMU 用户态模拟，构建与冒烟
  # 都在目标架构里执行——锁定 sha256 的 ARM64 原生模块必须能被 Node 真实加载，
  # lxserver/lxmusic 正常运行且 healthz 通过，不再只验"构建成功"。
  images-multiarch:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            arch: x64
          - platform: linux/arm64
            arch: arm64
    steps:
      - uses: actions/checkout@v4
      - name: Set up QEMU (arm64 emulation)
        if: matrix.arch == 'arm64'
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@v3
      - name: Build fnmusic-sources for ${{ matrix.platform }}
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          load: true
          tags: fnmusic-sources:ci
          build-args: |
            BASE_IMAGE=python:3.13-slim
            PIP_INDEX_URL=https://pypi.org/simple
            APT_MIRROR=
          cache-from: type=gha,scope=fnmusic-images-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=fnmusic-images-${{ matrix.arch }}
      - name: Verify non-root contract for each bundled service
        run: |
          for svc in musicdl musicbox lxmusic; do
            docker run --rm --platform '${{ matrix.platform }}' --network none --user 1000 --entrypoint python \
              -v "$PWD/tests/integration/production_contract.py:/tmp/production_contract.py:ro" \
              fnmusic-sources:ci /tmp/production_contract.py \
              "$svc" --app-dir "/srv/${svc}-service" --require-non-root
          done
      - name: Smoke lxmusic chain on ${{ matrix.platform }}
        run: |
          mkdir -p /tmp/fnrepo
          printf '%s\n' 'FNMUSIC_LX_ENABLED=true' 'FNMUSIC_WEBUI_ENABLED=false' > /tmp/fnrepo/.env
          name="fnmusic-ci-lx-${{ matrix.arch }}"
          cleanup() { docker logs "$name" 2>&1 | tail -100; docker rm -f "$name"; }
          trap cleanup EXIT
          docker run -d --name "$name" --platform '${{ matrix.platform }}' --network none \
            -v /tmp/fnrepo:/repo fnmusic-sources:ci
          # 平台原生绑定已随镜像落位（ARM64 包来自锁定 sha256 校验的离线构件）
          docker exec "$name" sh -c "test -s '/srv/lxserver/node_modules/music-tag-native-linux-${{ matrix.arch }}-gnu/music-tag-native.linux-${{ matrix.arch }}-gnu.node'"
          # lxserver RUNNING 即证明 Node 真实加载了原生模块（缺失时进程会崩溃进入 FATAL）
          ready=0
          for attempt in $(seq 1 120); do
            if docker exec "$name" supervisorctl -c /etc/supervisor/supervisord.conf status lxserver 2>/dev/null | grep -q RUNNING \
              && docker exec "$name" python -c 'import urllib.request,json; d=json.load(urllib.request.urlopen("http://127.0.0.1:8003/healthz", timeout=3)); assert d.get("ok") is True' 2>/dev/null; then
              ready=1
              break
            fi
            sleep 1
          done
          test "$ready" = 1 || { echo "ERROR: lxmusic 链路未就绪"; exit 1; }
          lx_pid="$(docker exec "$name" supervisorctl -c /etc/supervisor/supervisord.conf pid lxserver)"
          echo "lxserver pid=${lx_pid}; 观察 120s 稳定性..."
          sleep 120
          docker exec "$name" supervisorctl -c /etc/supervisor/supervisord.conf status lxserver | grep -q RUNNING
          test "$(docker exec "$name" supervisorctl -c /etc/supervisor/supervisord.conf pid lxserver)" = "$lx_pid"
          docker exec "$name" python -c 'import urllib.request,json; d=json.load(urllib.request.urlopen("http://127.0.0.1:8003/healthz", timeout=3)); assert d.get("ok") is True'
          docker exec "$name" supervisorctl -c /etc/supervisor/supervisord.conf status lxmusic | grep -q RUNNING
