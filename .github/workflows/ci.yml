name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.11 = 已验证的最低支持版本；3.13 = 与生产 Docker 镜像一致
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      # 显式安装 node：lxmusic-service/test_bridge_node.py 依赖 node 跑 js/test_bridge.js，
      # 只靠 runner 预装一旦变动，桥的 13 个行为测试会静默 skip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install audio test tools
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install test dependencies
        run: >
          python -m pip install -r proxy/requirements.txt
          -r webui-service/requirements.txt
          pytest mutagen qrcode pillow PyYAML pytest-cov

      - name: Shell script syntax check
        run: |
          while IFS= read -r -d '' script; do
            bash -n "$script"
          done < <(git ls-files -z '*.sh')

      - name: Python compile check
        run: >
          python -m py_compile proxy/app.py proxy/recommend.py proxy/env_merge.py proxy/version.py
          lxmusic-service/app.py lxmusic-service/source_runtime.py lxmusic-service/verify_source.py
          musicdl-service/app.py musicdl-service/hardening.py
          musicbox-service/app.py musicbox-service/runner.py musicbox-service/netease_ext.py
          webui-service/app.py

      # 覆盖率仅作摘要展示（不设门槛）；cov 参数只出现在 CI，本地 pytest 无需装 pytest-cov
      - name: Run tests
        run: >
          python -m pytest
          --cov=proxy --cov=lxmusic-service --cov=musicdl-service --cov=musicbox-service --cov=webui-service
          --cov-report=term

  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Shellcheck errors
        run: |
          git ls-files -z '*.sh' | xargs -0 shellcheck -S error
          # fpk 生命周期脚本（无 .sh 后缀）同样纳入检查
          git ls-files -z 'packaging/fpk/cmd/*' | xargs -0 shellcheck -S error

  fpk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download fnpack
        run: |
          curl -fsSL -o fnpack \
            "https://static2.fnnas.com/fnpack/fnpack-${FNPACK_VERSION}-linux-amd64"
          chmod +x fnpack && sudo mv fnpack /usr/local/bin/fnpack
        env:
          FNPACK_VERSION: "1.2.3"

      - name: Build fpk package
        run: |
          ./packaging/fpk/build.sh
          ls -la dist/

      - name: Verify package artifact
        run: |
          fpk_file="$(ls dist/fnmusic-ext-*.fpk)"
          test -s "$fpk_file"
          test -s "${fpk_file}.sha256"
          # fpk 为 tar.gz，内层 app.tgz + cmd/config/wizard/manifest/ICON 齐全
          tar -tzf "$fpk_file" | grep -E '^app\.tgz$'
          tar -tzf "$fpk_file" | grep -E '^cmd/main$'
          tar -tzf "$fpk_file" | grep -E '^manifest$'
          tar -tzf "$fpk_file" | grep -E '^ICON\.PNG$'
          ( cd dist && sha256sum -c "$(basename "$fpk_file").sha256" )


  production:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [musicdl, musicbox, lxmusic]
        python: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install real production dependencies
        run: python -m pip install -r '${{ matrix.service }}-service/requirements.txt'
      - name: Offline dependency and CLI contract
        run: python tests/integration/production_contract.py '${{ matrix.service }}' --app-dir '${{ matrix.service }}-service'

  images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build unified fnmusic-sources image
        run: |
          docker build --build-arg BASE_IMAGE=python:3.13-slim \
            --build-arg PIP_INDEX_URL=https://pypi.org/simple \
            --build-arg APT_MIRROR= \
            -f container/Dockerfile -t fnmusic-sources:ci .
      - name: Verify non-root contract for each bundled service
        run: |
          for svc in musicdl musicbox lxmusic; do
            docker run --rm --network none --user 1000 --entrypoint python \
              -v "$PWD/tests/integration/production_contract.py:/tmp/production_contract.py:ro" \
              fnmusic-sources:ci /tmp/production_contract.py \
              "$svc" --app-dir "/srv/${svc}-service" --require-non-root
          done
      - name: Verify on-demand musicdl healthz
        run: |
          mkdir -p /tmp/fnrepo
          printf '%s\n' 'FNMUSIC_MUSICDL_ENABLED=true' 'FNMUSIC_WEBUI_ENABLED=false' > /tmp/fnrepo/.env
          name="fnmusic-ci-sources"
          trap 'docker logs "$name"; docker rm -f "$name"' EXIT
          docker run -d --name "$name" --network none \
            -v /tmp/fnrepo:/repo fnmusic-sources:ci
          ready=0
          for attempt in $(seq 1 40); do
            if docker exec "$name" python -c 'import urllib.request; urllib.request.urlopen("http://127.0.0.1:8001/healthz", timeout=2)'; then
              ready=1
              break
            fi
            sleep 1
          done
          test "$ready" = 1
