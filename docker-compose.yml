# 可选音源（至少启用一个）
# musicdl: https://github.com/CharlesPikachu/musicdl
# musicbox: https://github.com/darknessomi/musicbox
services:
  musicdl:
    build:
      context: ./musicdl-service
      dockerfile: Dockerfile
    container_name: fnmusic-musicdl
    ports:
      - "127.0.0.1:8768:8000"
    environment:
      - MUSICDL_SOURCES=KuwoMusicClient,MiguMusicClient
      - MUSICDL_SEARCH_TIMEOUT=12
      - MUSICDL_LIMIT_PER_SOURCE=10
      - MUSICDL_URL_TTL=1800
      - MUSICDL_CACHE_MAX=3000
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request; urllib.request.urlopen(\"http://127.0.0.1:8000/healthz\")' || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s

  musicbox:
    build:
      context: ./musicbox-service
      dockerfile: Dockerfile
    container_name: fnmusic-musicbox
    ports:
      - "127.0.0.1:8770:8000"
    volumes:
      - musicbox-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request; urllib.request.urlopen(\"http://127.0.0.1:8000/healthz\")' || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  musicbox-data:
