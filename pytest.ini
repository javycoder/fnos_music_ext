[pytest]
# Full suite: python3 scripts/run_tests.py (isolated service interpreters).
# Keep paths here and scripts/run_tests.py in sync; runner regression checks this.
# Individual paths remain runnable with python3 -m pytest <path>.
testpaths =
    proxy/tests
    lxmusic-service
    musicdl-service
    webui-service
    container
    packaging/tests
    tests/runner
