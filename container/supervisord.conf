; fnmusic-sources 容器进程表：五个程序全部 autostart=false，
; 由 entrypoint.sh 按 /repo/.env 的启用开关 supervisorctl start（按需加载）。
; 运行期切源 = supervisorctl stop/start（WebUI 同容器内调用），无需 docker.sock。

[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid

[unix_http_server]
file=/tmp/supervisor.sock
chmod=0700

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///tmp/supervisor.sock

[program:musicdl]
directory=/srv/musicdl-service
command=uvicorn app:app --host 0.0.0.0 --port 8001
autostart=false
autorestart=true
startretries=5
stopsignal=TERM
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:musicbox]
directory=/srv/musicbox-service
command=uvicorn app:app --host 0.0.0.0 --port 8002
autostart=false
autorestart=true
startretries=5
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

; lxserver（Node）：唯一不把 stdout 汇到 /dev/stdout 的进程。
; 原因：docker logs 是单向管道，管理页「日志导出」读不到其中的内容；#108 的
; 附件里两个进程都 RUNNING、查询持续 TimeoutError，却拿不到任何 lxserver 运行
; 日志可查。这里改为落到共享日志根（与 FNMUSIC_LOG_DIR 同源），由 fnlog 的
; 有界轮转策略统一回收，导出包即可包含它。
; 有界滚动：单文件 10MB，最多保留 3 份备份，避免 NAS 磁盘被填满。
[program:lxserver]
directory=/srv/lxserver
command=node index.js
autostart=false
autorestart=true
startretries=5
startsecs=3
stopwaitsecs=10
stopsignal=TERM
stopasgroup=true
killasgroup=true
stdout_logfile=/repo/logs/lxserver.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
redirect_stderr=true
environment=DATA_PATH="/data/lxserver",CONFIG_PATH="/data/lxserver/config.js",PORT="8005",BIND_IP="127.0.0.1"

[program:lxmusic]
directory=/srv/lxmusic-service
command=uvicorn app:app --host 0.0.0.0 --port 8003
autostart=false
autorestart=true
startretries=5
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:webui]
directory=/srv/webui-service
command=uvicorn app:app --host 0.0.0.0 --port 8004
autostart=false
autorestart=true
startretries=5
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true
